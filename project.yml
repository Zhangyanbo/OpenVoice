name: OpenVoice
options:
  createIntermediateGroups: true
  # 开发语言为中文:源码中的中文字符串是本地化 key,en 翻译在 String Catalog 中维护
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "15.0"
packages:
  Reorderable:
    path: Vendor/Reorderable
  SelectedTextKit:
    url: https://github.com/tisfeng/SelectedTextKit.git
    from: 2.6.5
targets:
  OpenVoice:
    type: application
    platform: macOS
    dependencies:
      - package: Reorderable
      - package: SelectedTextKit
    sources:
      - Sources
    postBuildScripts:
      - name: Regenerate app icons
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP_RES="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$APP_RES"
          # 每次构建都从设计稿重新生成 .icns(设计稿可能随时被编辑)
          SRC="$SRCROOT/icon/icon_design.png"
          if [ -f "$SRC" ]; then
            CATALOG="$TEMP_DIR/OpenVoiceAssets.xcassets"
            ICONSET="$CATALOG/AppIcon.appiconset"
            COMPILED="$TEMP_DIR/OpenVoiceAssetsCompiled"
            rm -rf "$CATALOG" "$COMPILED"
            mkdir -p "$ICONSET" "$COMPILED"
            cp "$SRCROOT/scripts/asset_catalog_contents.json" "$CATALOG/Contents.json"
            cp "$SRCROOT/scripts/app_icon_contents.json" "$ICONSET/Contents.json"
            for s in 16 32 128 256 512; do
              sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
              d=$((s*2))
              sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
            done
            xcrun actool "$CATALOG" --compile "$COMPILED" --platform macosx \
              --minimum-deployment-target "$MACOSX_DEPLOYMENT_TARGET" --app-icon AppIcon \
              --output-partial-info-plist "$TEMP_DIR/AppIconInfo.plist" >/dev/null
            cp "$COMPILED/AppIcon.icns" "$APP_RES/AppIcon.icns"
          fi
          # 界面内使用的透明底图标 + 菜单栏模板图标,存在才拷贝
          for f in icon_design_white icon_design_black icon_design_bar; do
            if [ -f "$SRCROOT/icon/$f.png" ]; then
              cp "$SRCROOT/icon/$f.png" "$APP_RES/$f.png"
            fi
          done
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: OpenVoice
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.5.1"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: "语音输入需要使用麦克风录制你的声音。录音结束后立即停止访问。"
        NSSpeechRecognitionUsageDescription: "使用 Apple 本地语音模型将录音转换为文字。"
        NSHumanReadableCopyright: "© 2026 Yanbo Zhang · PolyForm Noncommercial 1.0.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openvoice.app
        SWIFT_VERSION: "5.0"
        # 稳定签名身份:ad-hoc("-")每次构建签名都变,TCC 会把新构建当成
        # 另一个 App,导致每次重编译后辅助功能/麦克风权限失效。
        # 没有此证书的贡献者改回 "-",但要接受每次重编译后 tccutil reset 重授权。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: CYKTJH6DJM
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        # FoundationModels 只存在于 macOS 26+。Apple 模型不做旧系统回退，
        # 但框架必须弱链接，不能让其他模型来源也无法在旧系统启动。
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        # 图标生成脚本要读 icon/ 写入 app 包,不能开脚本沙箱
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
  OpenVoiceTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: OpenVoice
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
