name: OpenVoiceInput
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
targets:
  OpenVoiceInput:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: OpenVoiceInput
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: "语音输入需要使用麦克风录制你的声音。录音结束后立即停止访问。"
        NSHumanReadableCopyright: "Open source, MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openvoiceinput.app
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
